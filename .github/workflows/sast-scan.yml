name: "sast-scan"

on:
  push:
    branches: [githubcicd]
  workflow_dispatch:

concurrency:
  group: sast-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm ci --force

      - name: Download OWASP Dependency-Check
        run: |
          wget -q https://github.com/dependency-check/DependencyCheck/releases/download/v12.2.2/dependency-check-12.2.2-release.zip
          unzip -q dependency-check-12.2.2-release.zip -d $HOME/dependency-check

      - name: Cache OWASP vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: odc-data-v12.2.2-${{ runner.os }}
          restore-keys: |
            odc-data-v12.2.2-

      - name: Run OWASP Dependency-Check
        run: |
          chmod +x $HOME/dependency-check/dependency-check/bin/dependency-check.sh
          mkdir -p $HOME/.dependency-check-data
          $HOME/dependency-check/dependency-check/bin/dependency-check.sh \
            --project "bitcoin" \
            --data "$HOME/.dependency-check-data" \
            --nvdDatafeed "https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz" \
            --out . \
            --scan . \
            --exclude '**/node_modules/**' \
            --disableOssIndex

      - name: Archive SAST report
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: ./dependency-check-report.html
